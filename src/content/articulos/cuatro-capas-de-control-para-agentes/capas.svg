<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Archivo, Arial, sans-serif">
  <rect width="1100" height="520" fill="#F6F4EE"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1E26"/></marker>
  </defs>

  <!-- Flujo principal -->
  <rect x="30" y="70" width="150" height="110" fill="#FFFFFF" stroke="#0F1E26" stroke-width="2"/>
  <text x="50" y="118" font-size="20" font-weight="800" fill="#0F1E26">Pedido</text>
  <text x="50" y="146" font-size="15" fill="#55636B">usuario, ticket</text>
  <text x="50" y="166" font-size="15" fill="#55636B">o evento</text>

  <rect x="226" y="76" width="170" height="110" fill="#0F1E26"/>
  <rect x="220" y="70" width="170" height="110" fill="#D4AE5E" stroke="#0F1E26" stroke-width="2"/>
  <text x="240" y="118" font-size="20" font-weight="800" fill="#0F1E26">Agente</text>
  <text x="240" y="146" font-size="15" fill="#0F1E26">razona y propone</text>
  <text x="240" y="166" font-size="15" fill="#0F1E26">una acción</text>

  <rect x="430" y="40" width="200" height="170" fill="#FFFFFF" stroke="#0F1E26" stroke-width="2"/>
  <text x="450" y="76" font-size="14" font-weight="700" fill="#163A4A">Capa 1</text>
  <text x="450" y="104" font-size="20" font-weight="800" fill="#0F1E26">Política</text>
  <text x="450" y="134" font-size="15" fill="#55636B">¿Está permitido?</text>
  <text x="450" y="156" font-size="15" fill="#55636B">Identidad, permisos</text>
  <text x="450" y="178" font-size="15" fill="#55636B">y límites, en código</text>

  <rect x="670" y="40" width="200" height="170" fill="#FFFFFF" stroke="#0F1E26" stroke-width="2"/>
  <text x="690" y="76" font-size="14" font-weight="700" fill="#163A4A">Capa 2</text>
  <text x="690" y="104" font-size="20" font-weight="800" fill="#0F1E26">Ejecución</text>
  <text x="690" y="134" font-size="15" fill="#55636B">Gateway de</text>
  <text x="690" y="156" font-size="15" fill="#55636B">herramientas, sandbox,</text>
  <text x="690" y="178" font-size="15" fill="#55636B">topes y cortes</text>

  <rect x="910" y="70" width="160" height="110" fill="#163A4A" stroke="#0F1E26" stroke-width="2"/>
  <text x="930" y="118" font-size="20" font-weight="800" fill="#F6F4EE">Sistemas</text>
  <text x="930" y="146" font-size="15" fill="#C9D3D8">APIs, bases</text>
  <text x="930" y="166" font-size="15" fill="#C9D3D8">de datos, ERP</text>

  <line x1="182" y1="125" x2="216" y2="125" stroke="#0F1E26" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="392" y1="125" x2="426" y2="125" stroke="#0F1E26" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="632" y1="125" x2="666" y2="125" stroke="#0F1E26" stroke-width="2.5" marker-end="url(#f)"/>
  <line x1="872" y1="125" x2="906" y2="125" stroke="#0F1E26" stroke-width="2.5" marker-end="url(#f)"/>

  <!-- Escalamiento humano -->
  <path d="M530 212 V262 H580" fill="none" stroke="#0F1E26" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#f)"/>
  <rect x="584" y="244" width="250" height="38" fill="#D4AE5E" stroke="#0F1E26" stroke-width="2"/>
  <text x="598" y="269" font-size="15" font-weight="700" fill="#0F1E26">Supera el umbral: aprueba una persona</text>

  <!-- Capas transversales -->
  <rect x="30" y="320" width="1040" height="78" fill="#FFFFFF" stroke="#0F1E26" stroke-width="2"/>
  <text x="50" y="352" font-size="14" font-weight="700" fill="#163A4A">Capa 3</text>
  <text x="50" y="380" font-size="20" font-weight="800" fill="#0F1E26">Evaluación</text>
  <text x="300" y="370" font-size="16" fill="#55636B">Antes: casos de prueba. Durante: precisión, costo, latencia y tasa de escalamiento.</text>

  <rect x="30" y="414" width="1040" height="78" fill="#0F1E26"/>
  <text x="50" y="446" font-size="14" font-weight="700" fill="#D4AE5E">Capa 4</text>
  <text x="50" y="474" font-size="20" font-weight="800" fill="#F6F4EE">Auditoría</text>
  <text x="300" y="464" font-size="16" fill="#C9D3D8">Registro inalterable: pedido, datos consultados, herramientas, resultado, aprobación y versiones.</text>
</svg>
